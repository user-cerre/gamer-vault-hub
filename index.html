<!-- Main HTML structure -->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"  content="width = device-width, initial-scale = 1.0">
        <title>GamerVaultHub</title>
        <link rel = "stylesheet" href = "src/css/style.css">
    </head>
    <body>
        <header>
            <h1>GamerVault Hub</h1>
            <nav aria-label="Main navigation">
                <input type="checkbox" id="burger">
                <label for="burger" class="burger-icon">☰</label>

                <div class="nav-controls">
                    <!-- Search -->
                    <label for="search">Search Game:</label>
                    <input type="text" id="search" placeholder="Type title...">

                    <!-- Prive filter -->
                    <label for="maxPrice">Max Price ($<span id="price-val">60</span>):</label>
                    <input type="range" id="maxPrice" min="0" max="60" value="60" step="5">

                    <!-- Dark Mode -->
                    <button type="button" id="darkMode">🌙 Theme</button>
                </div>
            </nav>
        </header>
        <main>
            <section id="games-grid"></section>
            <dialog id="game-modal">
                <button type="button" id="closeInfoProtonDB" aria-label="Close modal">&times;</button>
                <div id="modal-body">
                </div>
            </dialog>
        </main>
        <footer>
            <p>GamerVault Hub &copy; 2026 — Version 1.1</p>
        </footer>
        <script type="module" src="src/js/app.js"></script>
    </body>
</html>
